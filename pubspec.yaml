name: splitpay
description: "Split & Pay - ứng dụng chia tiền và quản lý công nợ nhóm."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # --- Đăng nhập Google ---
  google_sign_in: ^6.2.1

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Hình ảnh ---
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # --- OCR quét bill (on-device) ---
  google_mlkit_text_recognition: ^0.13.1

  # --- Tiện ích ---
  share_plus: ^10.0.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # --- QR: hiển thị và quét ---
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # --- HTTP: upload ảnh lên Cloudinary ---
  http: ^1.2.2

  # --- Format tiền tệ (VND) ---
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
